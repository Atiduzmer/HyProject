<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕 · 3D 模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 36%, #3c5a66 0%, #1a2b34 58%, #0a1217 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: #e6eef0;
  }
  canvas { display: block; }
  .caption { position: fixed; left: 32px; bottom: 28px; pointer-events: none; }
  .caption h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .4em; }
  .caption p { margin: 8px 0 0; font-size: 12px; letter-spacing: .2em; opacity: .5; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="caption">
  <h1>鹈鹕</h1>
  <p>拖拽旋转 · 滚轮缩放</p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- 基础 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 60);
camera.position.set(4.6, 1.9, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0.2);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.56;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;

// ---------- 灯光：暖色主光 + 冷色轮廓光 ----------
scene.add(new THREE.HemisphereLight(0xdcefff, 0x2b3a3f, 0.85));
const key = new THREE.DirectionalLight(0xffe6c4, 2.4);
key.position.set(3.5, 5.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.2, right: 2.2, bottom: -2, top: 3 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.025;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fc4e8, 1.1);
rim.position.set(-3, 2.5, -4);
scene.add(rim);

// ---------- 材质 ----------
const mat = (color, roughness = 0.8, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, ...extra });
const M = {
  plume: mat(0xffffff, 0.88),
  down:  mat(0xf3eee4, 0.9),
  bill:  mat(0xefc85a, 0.45),
  ridge: mat(0x9aa3a8, 0.5),
  pouch: mat(0xf19a2c, 0.42, { side: THREE.DoubleSide }),
  nail:  mat(0xdf5f2a, 0.35),
  skin:  mat(0xf3b49c, 0.6),
  leg:   mat(0xe7906f, 0.6),
  claw:  mat(0x3a302b, 0.5),
  eye:   mat(0x0d0d10, 0.08),
  glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  wood:  mat(0x6d5846, 0.95),
  groove: mat(0x3b2e25, 1),
  rope:  mat(0xbfa77c, 0.95),
};

const add = (geo, material, parent) => {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};
// 两点之间的锥形杆
const rod = (a, b, r1, r2, material, parent, seg = 12) => {
  const d = b.clone().sub(a);
  const m = add(new THREE.CylinderGeometry(r2, r1, d.length(), seg), material, parent);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  return m;
};

// ---------- 羽毛：逐片实例化 ----------
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const featherGeo = new THREE.SphereGeometry(0.5, 14, 8);
featherGeo.scale(1, 0.16, 1);
featherGeo.translate(0, 0, 0.4);          // 羽根在原点，羽尖朝 +Z

class Plumage {
  items = [];
  add(pos, dir, normal, width, length, color) {
    const z = dir.clone().normalize();
    const x = normal.clone().cross(z).normalize();
    const y = z.clone().cross(x);
    const m = new THREE.Matrix4().makeBasis(x, y, z).scale(V(width, width, length)).setPosition(pos);
    this.items.push([m, new THREE.Color(color).multiplyScalar(0.95 + rand() * 0.08)]);
  }
  // 在椭球面上均匀铺羽，羽尖顺着 flow 方向贴伏
  coat(radii, count, flow, style) {
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < count; i++) {
      const uy = 1 - 2 * (i + 0.5) / count, r = Math.sqrt(1 - uy * uy);
      const u = V(Math.cos(i * golden) * r, uy, Math.sin(i * golden) * r);
      const s = style(u);
      if (!s) continue;
      const n = u.clone().divide(radii).normalize();
      const d = flow.clone().addScaledVector(n, -flow.dot(n));
      if (d.lengthSq() < 0.01) d.set(0, -1, 0).addScaledVector(n, n.y);
      d.normalize().addScaledVector(n, 0.22);
      this.add(u.clone().multiply(radii), d, n, s.w, s.len, s.color);
    }
  }
  build(parent) {
    const mesh = new THREE.InstancedMesh(featherGeo, M.plume, this.items.length);
    this.items.forEach(([m, c], i) => { mesh.setMatrixAt(i, m); mesh.setColorAt(i, c); });
    mesh.castShadow = mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }
}

const WHITE = new THREE.Color(0xf7f3ea), BUFF = new THREE.Color(0xf1dcae);
const GREY = new THREE.Color(0x8b8f96), BLACK = new THREE.Color(0x1d1d21);

// ---------- 木桩与水面 ----------
const post = add(new THREE.CylinderGeometry(0.5, 0.5, 1.7, 48), M.wood, scene);
post.position.y = -0.85;
for (let i = 0; i < 26; i++) {                       // 木纹竖槽，疏密不匀
  const a = (i + rand() * 0.6) / 26 * Math.PI * 2;
  const g = add(new THREE.BoxGeometry(0.014, 1.66, 0.02), M.groove, scene);
  g.position.set(Math.sin(a) * 0.493, -0.872, Math.cos(a) * 0.493);
  g.rotation.y = a;
}
for (const r of [0.14, 0.27, 0.39]) {                // 年轮
  const ring = add(new THREE.RingGeometry(r, r + 0.012, 48), M.groove, scene);
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002;
}
for (let i = 0; i < 4; i++) {                        // 缆绳
  const rope = add(new THREE.TorusGeometry(0.522, 0.032, 10, 64), M.rope, scene);
  rope.rotation.set(Math.PI / 2 + (i % 2 ? 0.03 : -0.02), 0, 0);
  rope.position.y = -0.34 - i * 0.062;
}

const fade = document.createElement('canvas');
fade.width = fade.height = 256;
const ctx = fade.getContext('2d');
const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
grad.addColorStop(0, '#d8d8d8');
grad.addColorStop(0.55, '#5a5a5a');
grad.addColorStop(1, '#000');
ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
const water = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 64),
  new THREE.MeshStandardMaterial({
    color: 0x2c6f86, roughness: 0.42, metalness: 0.1, transparent: true,
    alphaMap: new THREE.CanvasTexture(fade), depthWrite: false,
  }));
water.rotation.x = -Math.PI / 2; water.position.y = -1.35; water.receiveShadow = true;
scene.add(water);
const ripples = [0, 1, 2].map(i => {
  const r = new THREE.Mesh(new THREE.RingGeometry(0.985, 1, 96),
    new THREE.MeshBasicMaterial({ color: 0xcfe9f2, transparent: true, depthWrite: false }));
  r.rotation.x = -Math.PI / 2; r.position.y = -1.345; r.userData.phase = i / 3;
  scene.add(r);
  return r;
});

// ---------- 鸟身 ----------
const bird = new THREE.Group();
bird.position.y = -0.24;
scene.add(bird);

const body = new THREE.Group();
body.position.set(0, 1.02, 0);
body.rotation.x = -0.3;                              // 胸挺尾垂
bird.add(body);

const BODY = V(0.42, 0.4, 0.62);
add(new THREE.SphereGeometry(1, 40, 28), M.down, body).scale.copy(BODY).multiplyScalar(0.96);
const bodyCoat = new Plumage();
bodyCoat.coat(BODY, 780, V(0, -0.18, -1), u => (u.z > 0.64 && u.y > -0.08 && Math.abs(u.x) < 0.5) ? null : ({
  w: 0.1, len: 0.15 + (1 - u.z) * 0.03,
  color: WHITE.clone().lerp(BUFF, THREE.MathUtils.clamp((u.z - 0.45) * 1.5 - u.y * 0.4, 0, 0.75)),  // 胸前一抹黄
}));
for (let i = -4; i <= 4; i++) {                      // 尾羽成扇
  bodyCoat.add(V(i * 0.035, -0.03, -0.52), V(i * 0.11, -0.02, -1), V(0, 1, 0), 0.1, 0.34 - Math.abs(i) * 0.012, WHITE);
}
bodyCoat.build(body);

// 收拢的双翼：覆羽白，次级飞羽灰，初级飞羽黑且修长
const wings = [];
for (const side of [-1, 1]) {
  const wing = new THREE.Group();
  wing.position.set(side * 0.33, 0.08, -0.1);
  wing.rotation.set(0, side * 0.12, side * 0.3);
  body.add(wing);
  const R = V(0.11, 0.3, 0.6);
  add(new THREE.SphereGeometry(1, 24, 18), M.down, wing).scale.copy(R).multiplyScalar(0.86);
  const coat = new Plumage();
  coat.coat(R, 420, V(0, -0.22, -1), u => {
    if (u.x * side < -0.15) return null;
    const k = (1 - u.z) / 2 + (0.5 - u.y) * 0.12;    // 0 肩 → 1 翼尖
    return {
      w: 0.105 - k * 0.03,
      len: 0.13 + k * k * 0.34,
      color: k > 0.74 ? BLACK : k > 0.6 ? GREY.clone().lerp(BLACK, (k - 0.6) / 0.14 * 0.6) : WHITE.clone().lerp(GREY, Math.max(0, k - 0.4) * 1.4),
    };
  });
  for (let i = 0; i < 7; i++) {                      // 交叠探出尾后的初级飞羽
    coat.add(V(side * 0.03, -0.14 + i * 0.035, -0.5 + i * 0.012),
             V(-side * 0.1, -0.2 + i * 0.03, -1), V(side, 0, 0), 0.075, 0.5 - i * 0.03, BLACK);
  }
  coat.build(wing);
  wings.push(wing);
}

// ---------- 颈：沿 S 形曲线、粗细渐变的管体 ----------
const neckCurve = new THREE.CatmullRomCurve3([
  V(0, 1.13, 0.36), V(0, 1.38, 0.64), V(0, 1.7, 0.65), V(0, 1.96, 0.47), V(0, 2.12, 0.4), V(0, 2.22, 0.45),
]);
const NS = 56, NR = 24;
const neckGeo = new THREE.TubeGeometry(neckCurve, NS, 1, NR);
const neckRadius = t => {
  const keys = [[0, 0.215], [0.28, 0.13], [0.55, 0.092], [0.85, 0.086], [1, 0.1]];
  let i = 1; while (t > keys[i][0]) i++;
  const [t0, r0] = keys[i - 1], [t1, r1] = keys[i];
  return THREE.MathUtils.lerp(r0, r1, THREE.MathUtils.smoothstep(t, t0, t1));
};
const np = neckGeo.attributes.position;
for (let i = 0; i <= NS; i++) {
  const c = neckCurve.getPointAt(i / NS), r = neckRadius(i / NS);
  for (let j = 0; j <= NR; j++) {
    const k = i * (NR + 1) + j;
    const v = V(np.getX(k), np.getY(k), np.getZ(k)).sub(c).multiplyScalar(r).add(c);
    np.setXYZ(k, v.x, v.y, v.z);
  }
}
neckGeo.computeVertexNormals();
add(neckGeo, M.down, bird);

// ---------- 头 ----------
const head = new THREE.Group();
head.position.set(0, 2.22, 0.46);
bird.add(head);
add(new THREE.SphereGeometry(0.14, 36, 28), M.down, head).scale.set(0.88, 0.95, 1.22);
add(new THREE.SphereGeometry(0.09, 24, 18), M.down, head).position.set(0, 0.03, 0.1);   // 额

for (const s of [-1, 1]) {
  const patch = add(new THREE.SphereGeometry(0.075, 24, 18), M.skin, head);            // 眼周裸皮
  patch.position.set(s * 0.082, 0.0, 0.085); patch.scale.set(0.36, 0.8, 1.15);
  add(new THREE.SphereGeometry(0.024, 20, 14), M.eye, head).position.set(s * 0.1, 0.018, 0.085);
  add(new THREE.SphereGeometry(0.006, 8, 6), M.glint, head).position.set(s * 0.12, 0.03, 0.094);
}
const crest = new Plumage();                         // 枕后垂下的冠羽
for (let i = -3; i <= 3; i++) {
  crest.add(V(i * 0.022, 0.06 - Math.abs(i) * 0.012, -0.13), V(i * 0.09, -0.75, -0.7), V(0, 0.7, -0.7),
            0.04, 0.24 - Math.abs(i) * 0.025, WHITE);
}
crest.build(head);

// ---------- 喙与喉囊 ----------
const bill = new THREE.Group();
bill.position.set(0, -0.02, 0.1);
bill.rotation.x = 0.87;                              // 喙尖下探约 50°
head.add(bill);
const L = 0.95;
const taper = (rTip, rBase, len) => {
  const g = new THREE.CylinderGeometry(rTip, rBase, len, 28, 12);
  g.rotateX(Math.PI / 2); g.translate(0, 0, len / 2);
  return g;
};
add(taper(0.04, 0.08, L), M.bill, bill).scale.y = 0.38;                                // 上喙
const ridge = add(taper(0.012, 0.028, L - 0.05), M.ridge, bill);                       // 喙脊
ridge.position.y = 0.022; ridge.scale.y = 0.6;
for (const s of [-1, 1]) {                                                             // 喙缘
  rod(V(s * 0.078, -0.012, 0.02), V(s * 0.04, -0.012, L - 0.02), 0.009, 0.007, M.nail, bill, 8);
}
const nail = add(new THREE.SphereGeometry(0.04, 20, 14), M.nail, bill);                // 喙尖的钩
nail.position.set(0, -0.012, L); nail.scale.set(0.95, 0.55, 0.9);
const hook = add(new THREE.ConeGeometry(0.026, 0.07, 14), M.nail, bill);
hook.position.set(0, -0.045, L + 0.012); hook.rotation.x = Math.PI - 0.35;

const lower = add(taper(0.03, 0.074, L - 0.05), M.bill, bill);                         // 下喙
lower.position.y = -0.034; lower.scale.y = 0.16;

// 喉囊：下半椭球，囊底靠近喙根处最深
const pouchGeo = new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
const pp = pouchGeo.attributes.position;
for (let i = 0; i < pp.count; i++) {
  const z = pp.getZ(i), sag = 1 - 0.35 * z;          // z<0 一侧（近喙根）更垂
  pp.setY(i, pp.getY(i) * sag * (1 + 0.04 * Math.sin(pp.getX(i) * 9)));
}
pouchGeo.computeVertexNormals();
const pouch = add(pouchGeo, M.pouch, bill);
pouch.position.set(0, -0.036, 0.43);
pouch.scale.set(0.066, 0.2, 0.43);

// ---------- 腿与蹼足 ----------
const footShape = new THREE.Shape();
const toes = [-0.62, 0, 0.62].map(a => new THREE.Vector2(Math.sin(a), Math.cos(a)));
footShape.moveTo(0.1, -0.08);
footShape.lineTo(toes[2].x, toes[2].y);
footShape.quadraticCurveTo(0.26, 0.74, toes[1].x, toes[1].y);
footShape.quadraticCurveTo(-0.26, 0.74, toes[0].x, toes[0].y);
footShape.lineTo(-0.1, -0.08);
footShape.closePath();
const footGeo = new THREE.ExtrudeGeometry(footShape, { depth: 0.04, bevelEnabled: false });
footGeo.rotateX(Math.PI / 2);                        // 铺平：趾尖朝 +Z

for (const s of [-1, 1]) {
  const hip = V(s * 0.15, 0.82, -0.02), heel = V(s * 0.17, 0.3, 0.0);
  rod(hip, heel, 0.045, 0.03, M.leg, bird, 14);
  add(new THREE.SphereGeometry(0.038, 14, 10), M.leg, bird).position.copy(heel).setY(0.275);
  const foot = new THREE.Group();
  foot.position.set(heel.x, 0.253, heel.z);
  foot.rotation.y = s * 0.28;
  foot.scale.setScalar(0.3);
  bird.add(foot);
  add(footGeo, M.leg, foot);
  for (const t of toes) {
    const tip = V(t.x, 0.0, t.y);
    rod(V(0, 0.03, -0.03), tip, 0.06, 0.035, M.leg, foot, 8);
    const claw = add(new THREE.ConeGeometry(0.03, 0.12, 8), M.claw, foot);
    claw.position.copy(tip).addScaledVector(tip.clone().normalize(), 0.05);
    claw.quaternion.setFromUnitVectors(V(0, 1, 0), tip.clone().normalize().setY(-0.25).normalize());
  }
}

// ---------- 动画 ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  body.scale.setScalar(1 + Math.sin(t * 1.5) * 0.006);                  // 呼吸
  head.rotation.y = Math.sin(t * 0.45) * 0.1;                           // 左右张望
  head.rotation.x = Math.sin(t * 0.7 + 1) * 0.025;
  pouch.scale.y = 0.2 + Math.sin(t * 2.3) * 0.006;                      // 喉囊微颤
  wings.forEach((w, i) => { w.rotation.x = Math.sin(t * 0.9 + i) * 0.012; });
  for (const r of ripples) {                                            // 桩脚涟漪
    const k = (t * 0.18 + r.userData.phase) % 1;
    r.scale.setScalar(0.55 + k * 1.5);
    r.material.opacity = 0.35 * (1 - k) * Math.min(1, k * 6);
  }
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
