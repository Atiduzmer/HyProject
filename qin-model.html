<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秦始皇 · 3D 模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #3a2b22 0%, #17110e 62%, #0b0807 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: #e9dcc3;
  }
  canvas { display: block; }
  .caption { position: fixed; left: 32px; bottom: 28px; pointer-events: none; }
  .caption h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .4em; }
  .caption p { margin: 8px 0 0; font-size: 12px; letter-spacing: .2em; opacity: .5; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="caption">
  <h1>秦始皇</h1>
  <p>拖拽旋转 · 滚轮缩放</p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 基础 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 50);
camera.position.set(2.4, 2.0, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ---------- 灯光 ----------
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x2a1c14, 0.9));
const key = new THREE.DirectionalLight(0xffe2b8, 2.6);
key.position.set(3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffa066, 0.9);   // 背后一道暖色轮廓光
rim.position.set(-3, 3, -4);
scene.add(rim);

// ---------- 材质（秦尚黑：玄衣纁裳） ----------
const mat = (color, roughness = 0.75, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });
const M = {
  robe:  mat(0x1b1b21, 0.82),
  red:   mat(0x8a1c1c, 0.7),
  gold:  mat(0xc9a14a, 0.35, 0.85),
  skin:  mat(0xdfb48c, 0.65),
  hair:  mat(0x0c0c0e, 0.6),
  jade:  mat(0xe6efe2, 0.25),
  stone: mat(0x3b342f, 0.95),
};

const figure = new THREE.Group();
scene.add(figure);
const add = (geo, material, parent = figure) => {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---------- 基座 ----------
add(new THREE.CylinderGeometry(1.15, 1.25, 0.14, 64), M.stone, scene).position.y = -0.07;
add(new THREE.TorusGeometry(1.15, 0.012, 8, 96), M.gold, scene).rotation.x = Math.PI / 2;

// ---------- 袍身（旋转体） ----------
const profile = new THREE.SplineCurve([
  [0.00, 0.00], [0.64, 0.00], [0.60, 0.10], [0.44, 0.60], [0.35, 1.00],
  [0.37, 1.25], [0.40, 1.42], [0.29, 1.53], [0.11, 1.57], [0.00, 1.57],
].map(([r, y]) => new THREE.Vector2(r, y))).getPoints(60)
  .map(p => new THREE.Vector2(Math.max(p.x, 0), p.y));
const body = add(new THREE.LatheGeometry(profile, 64), M.robe);

const hem = add(new THREE.TorusGeometry(0.625, 0.03, 12, 64), M.red);
hem.rotation.x = Math.PI / 2; hem.position.y = 0.04;

// 腰带、带钩、蔽膝
add(new THREE.CylinderGeometry(0.365, 0.365, 0.1, 48), M.red).position.y = 1.02;
add(new THREE.BoxGeometry(0.1, 0.07, 0.03), M.gold).position.set(0, 1.02, 0.37);
const apron = add(new THREE.BoxGeometry(0.24, 0.5, 0.016), M.red);
apron.position.set(0, 0.73, 0.435); apron.rotation.x = -0.21;
const apronTrim = add(new THREE.BoxGeometry(0.24, 0.02, 0.02), M.gold, apron);
apronTrim.position.y = -0.24;

// 交领：颈根处前倾的领圈，内衬一道素白中衣
const collar = add(new THREE.TorusGeometry(0.15, 0.032, 12, 48), M.red);
collar.position.set(0, 1.535, 0.03); collar.rotation.x = Math.PI / 2 + 0.38;
const inner = add(new THREE.TorusGeometry(0.115, 0.02, 10, 40), M.jade);
inner.position.set(0, 1.56, 0.02); inner.rotation.x = Math.PI / 2 + 0.3;

// ---------- 双臂（广袖） ----------
for (const s of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(s * 0.34, 1.42, 0);
  arm.rotation.set(-0.22, 0, s * 0.24);
  figure.add(arm);
  add(new THREE.SphereGeometry(0.112, 24, 16), M.robe, arm);
  add(new THREE.CylinderGeometry(0.11, 0.23, 0.72, 32), M.robe, arm).position.y = -0.36;
  const cuff = add(new THREE.TorusGeometry(0.215, 0.026, 10, 40), M.red, arm);
  cuff.rotation.x = Math.PI / 2; cuff.position.y = -0.71;
  add(new THREE.SphereGeometry(0.07, 20, 14), M.skin, arm).position.y = -0.75;
}

// ---------- 头 ----------
const head = new THREE.Group();
head.position.y = 1.86;
figure.add(head);
add(new THREE.CylinderGeometry(0.09, 0.1, 0.16, 20), M.skin).position.y = 1.62;
add(new THREE.SphereGeometry(0.24, 40, 32), M.skin, head).scale.set(0.94, 1.1, 0.98);

// 头发：罩住头顶与后脑
const hair = add(new THREE.SphereGeometry(0.25, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.52), M.hair, head);
hair.scale.set(0.96, 1.1, 1); hair.rotation.x = -0.42;

// 五官：细眼、怒眉、八字须、长髯
for (const s of [-1, 1]) {
  const eye = add(new THREE.SphereGeometry(0.02, 12, 10), M.hair, head);
  eye.position.set(s * 0.085, 0.03, 0.215); eye.scale.set(1.5, 0.6, 0.6);
  const brow = add(new THREE.BoxGeometry(0.09, 0.016, 0.02), M.hair, head);
  brow.position.set(s * 0.09, 0.085, 0.215); brow.rotation.z = s * 0.3;
  const mustache = add(new THREE.BoxGeometry(0.1, 0.018, 0.02), M.hair, head);
  mustache.position.set(s * 0.055, -0.1, 0.215); mustache.rotation.z = s * -0.45;
}
add(new THREE.SphereGeometry(0.022, 12, 10), M.skin, head).position.set(0, -0.03, 0.235);
const beard = add(new THREE.ConeGeometry(0.075, 0.34, 20), M.hair, head);
beard.position.set(0, -0.34, 0.15); beard.rotation.x = Math.PI + 0.18; beard.scale.z = 0.55;

// ---------- 冕冠：冠武 + 綖板 + 前后各十二旒 ----------
const crown = new THREE.Group();
crown.position.y = 0.25;
head.add(crown);
add(new THREE.CylinderGeometry(0.13, 0.15, 0.16, 32), M.hair, crown).position.y = 0.05;
add(new THREE.TorusGeometry(0.148, 0.012, 8, 40), M.gold, crown).rotation.x = Math.PI / 2;
const pin = add(new THREE.CylinderGeometry(0.008, 0.008, 0.46, 8), M.gold, crown);   // 笄
pin.rotation.z = Math.PI / 2; pin.position.y = 0.06;

const board = new THREE.Group();          // 前低后高，取“俯伏”之意
board.position.y = 0.15; board.rotation.x = 0.1;
crown.add(board);
const BW = 0.44, BD = 0.8;
add(new THREE.BoxGeometry(BW, 0.022, BD), M.hair, board);
add(new THREE.BoxGeometry(BW - 0.02, 0.006, BD - 0.02), M.red, board).position.y = -0.013;

const strings = [];
const beadGeo = new THREE.SphereGeometry(0.0115, 10, 8);
const beadMats = [M.jade, M.red, M.gold];
for (const side of [-1, 1]) {
  for (let i = 0; i < 12; i++) {
    const str = new THREE.Group();
    str.position.set((i - 5.5) * (BW - 0.04) / 11, -0.012, side * (BD / 2 - 0.012));
    str.rotation.x = -board.rotation.x;        // 抵消綖板倾斜，令旒垂直
    for (let j = 0; j < 9; j++) {
      const bead = add(beadGeo, beadMats[j % 3], str);
      bead.position.y = -0.022 - j * 0.025;
      bead.castShadow = false;               // 珠影落在脸上太碎，不投影
    }
    str.userData = { phase: i * 0.55 + (side > 0 ? 0 : 2), base: str.rotation.x };
    board.add(str);
    strings.push(str);
  }
}

// ---------- 动画 ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  body.scale.y = 1 + Math.sin(t * 1.4) * 0.004;            // 呼吸
  head.rotation.y = Math.sin(t * 0.5) * 0.08;              // 缓缓环视
  for (const s of strings) {
    s.rotation.x = s.userData.base + Math.sin(t * 1.8 + s.userData.phase) * 0.05;
    s.rotation.z = Math.sin(t * 1.3 + s.userData.phase * 1.7) * 0.03;
  }
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
